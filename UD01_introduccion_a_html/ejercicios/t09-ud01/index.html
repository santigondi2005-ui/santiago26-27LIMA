<!DOCKTYPE html>
<html>
	<head>
		<meta charset=”utf-8”/>
		<title>Formulario de rexistro</title>
		<meta name=”author” content=”santiago” />
		<meta name="description" content=”º9 tarea” />
		<meta name="keyword" content=”tarea” />
	</head>
    <body>
        <form action="" method="get">
            <label for="nombre">Nombre:
                <input type="text" name="name" id="nombre" placeholder="Introduce tu nombre" maxlength="50"/>
            </label>
            <br>
            <label for="apellidos">Apellidos:
                <input type="text" name="surname" id="apellidos" placeholder="Introduce tus apellidos" maxlength="50"/>
            </label>
            <br>
            <label for="sexo">Sexo:
                <br>
                <input type="radio" id="sexo" nombre="genero" value="Hombre"/>
                <label for="sexo">Hombre</label>
                <input type="radio" id="sexo" nombre="genero" value="Mujer"/>
                <label for="sexo">Mujer</label>
            </label>
            <br>
            <label for="email">Correo electrónico
                <input type="email" name="correo" id="email" placeholder="Introduce tu correo electrónico"/>
            </label>
            <br>
            <input type="checkbox" name="ofer" id="ofertas" checked="checked"/>
            <label for="ofertas">Desexo recibir información sobre novidades  e ofertas.</label>
            <br>
            <input type="checkbox" name="cond" id="condiciones"/>
            <label for="condiciones">Declaro aceptar as condicións xerais do programa e a normativa sobre protección de datos</label>
            <br>
            <label for="poblacion">Población:</label>
            <select name="poblacion">
                <option value="coruña" selected="selected">A Coruña</option>
                <option value="lugo">Lugo</option>
                <option value="ourense">Ourense</option>
                <option value="pontevedra">Pontevedra</option>
            </select>
            <br>
            <input type="button" value="enviar"/>
        </form>
    </body>
</html>
